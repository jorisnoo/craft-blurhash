name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, bcmath, pdo_mysql, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run package checks
        run: |
          composer --no-plugins validate --strict --no-check-publish
          composer audit
          vendor/bin/pest
          bash scripts/test-integration.sh

  required:
    name: Package checks
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ always() }}
    steps:
      - run: test "$MATRIX_RESULT" = success
        env:
          MATRIX_RESULT: ${{ needs.tests.result }}
